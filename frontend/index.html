<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chandrabhaga Academy</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        const spaPath = sessionStorage.getItem('chandrabhaga-spa-path');
        if (spaPath) {
          sessionStorage.removeItem('chandrabhaga-spa-path');
          history.replaceState(null, '', spaPath);
        }
      } catch (_) {}
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
